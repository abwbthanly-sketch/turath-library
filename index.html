<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><script src="ai-config.js"></script><title>المكتبة التراثية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;700&family=Scheherazade+New:wght@400;700&family=Cairo:wght@400;600&display=swap">
<style>
/* Layout: right-hand sidebar + main column (navy hero with search, category pills, text-status card, book list); sidebar becomes a bottom bar on phones. */
:root{
  --bg:#f9f6ef; --surface:#fffdf8; --fg:#1d2a3a; --muted:#6f6a5e; --line:#e6dfcc;
  --accent:#9a6c1c; --accent-fg:#ffffff; --gold:#c39a45; --gold-hi:#e2c27a; --gold-lo:#8f6a22;
  --navy-a:#1b4272; --navy-b:#0b1b31; --on-navy:#f3ead3; --on-navy-muted:#aab7c9;
  --pat:rgba(184,134,47,.08); --ok:#1f8a63; --warn:#d9892b; --off:#9aa0a6;
  --hl-yellow:#f6e58d; --hl-green:#bfe3c4; --hl-blue:#bcd9f2; --hl-pink:#f4c6d6;
  --font-ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --font-read:'Amiri','Traditional Arabic','Times New Roman',serif;
  --font-display:'Aref Ruqaa','Amiri',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141c; --surface:#151d28; --fg:#ece6d6; --muted:#9aa3ad; --line:#263140;
  --accent:#e2c27a; --accent-fg:#1a1405; --pat:rgba(226,194,122,.05);
  --hl-yellow:#6b5f1c; --hl-green:#2e5a38; --hl-blue:#27506f; --hl-pink:#6e3347; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c; --surface:#151d28; --fg:#ece6d6; --muted:#9aa3ad; --line:#263140;
  --accent:#e2c27a; --accent-fg:#1a1405; --pat:rgba(226,194,122,.05);
  --hl-yellow:#6b5f1c; --hl-green:#2e5a38; --hl-blue:#27506f; --hl-pink:#6e3347; color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);direction:rtl}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#shell{display:flex;height:100%;min-height:0}
aside{width:236px;flex:none;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;gap:6px}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand b{display:block;font-family:var(--font-display);font-size:21px;color:var(--fg);line-height:1.3;font-weight:700}
.brand small{color:var(--accent);font-size:12px}
.navbtn{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;border-radius:10px;font-size:15px;text-align:right;color:var(--fg);border-inline-end:3px solid transparent}
.navbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--muted)}
.navbtn[aria-current="page"]{background:color-mix(in srgb,var(--gold) 14%,transparent);border-inline-end-color:var(--gold);font-weight:600}
.navbtn[aria-current="page"] svg{color:var(--accent)}
.waqf{margin-top:auto;border:1px solid var(--line);border-radius:12px;padding:12px;background:color-mix(in srgb,var(--gold) 8%,var(--surface));font-size:12.5px;line-height:1.8;color:var(--muted)}
.waqf b{color:var(--accent);display:block;margin-bottom:2px;font-size:13px}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.main{flex:1;min-height:0;overflow-y:auto;background-image:repeating-linear-gradient(45deg,var(--pat) 0 1px,transparent 1px 30px),repeating-linear-gradient(-45deg,var(--pat) 0 1px,transparent 1px 30px)}
.main.reading{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;padding-block:10px}
.circ{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.circ svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round}
.mobbrand{display:none;font-family:var(--font-display);font-size:20px}
.hero{background:linear-gradient(160deg,var(--navy-a),var(--navy-b));color:var(--on-navy);padding-block:30px 26px;border-bottom:2px solid var(--gold)}
.hero .kicker{color:var(--gold-hi);font-size:13px}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,6vw,52px);margin:6px 0 10px;line-height:1.35;text-wrap:balance}
.hero p{margin:0 0 22px;color:var(--on-navy-muted);max-width:52ch;line-height:1.9;font-size:15px}
.divider{display:flex;align-items:center;gap:10px;margin:0 0 22px;color:var(--gold)}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold));max-width:240px}
.divider i:last-child{background:linear-gradient(270deg,transparent,var(--gold))}
.divider span{width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.hsearch{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:8px 8px 8px 10px}
.hsearch input{flex:1;min-width:0;background:none;border:0;padding:10px;color:var(--on-navy);font-size:15px;direction:rtl}
.hsearch input::placeholder{color:var(--on-navy-muted)}
.gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:#2a1d05;font-weight:600;border-radius:10px;padding:10px 22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.chip{border:1px solid rgba(255,255,255,.35);color:var(--on-navy);border-radius:999px;padding:10px 18px;font-size:14px}
.chip.soft{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06);padding:7px 14px;font-size:13px;color:var(--on-navy-muted);cursor:default}
.chip b{color:var(--on-navy);margin-inline-start:6px}
.sec{padding-block:22px 8px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sh h2{margin:0;font-size:19px;display:flex;gap:10px;align-items:center;font-weight:600}
.sh h2 .ico{width:34px;height:34px;border-radius:8px;background:color-mix(in srgb,var(--gold) 16%,transparent);display:grid;place-items:center;color:var(--accent)}
.sh h2 svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.link{color:var(--accent);font-size:14px}
.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-size:14px;white-space:nowrap}
.pill[aria-pressed="true"],.pill.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:#2a1d05;border-color:var(--gold);font-weight:600}
.status{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px;position:relative}
.status h3{margin:0 0 8px;font-size:14px;color:var(--accent);display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-weight:600}
.status h3 span{color:var(--muted);font-weight:400;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.status h3 span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--off)}
.status h3 span.ok::before{background:var(--ok)}.status h3 span.warn::before{background:var(--warn)}
.status p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.book{display:block;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;border-top:3px solid var(--gold)}
.book h3{margin:0 0 6px;font-size:18px;font-weight:600}
.meta{color:var(--muted);font-size:13px;line-height:1.8}
input.field,textarea{width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:13px;direction:rtl}
.hit p{margin:6px 0 0;font-family:var(--font-read);font-size:19px;line-height:1.9}
.badge{font-size:12.5px;color:var(--accent)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details details{border:0;margin:0 0 0 0;background:none;border-top:1px dashed var(--line);border-radius:0}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"‹";display:inline-block;margin-inline-end:10px;color:var(--gold);transition:transform .15s}
details[open]>summary::before{transform:rotate(-90deg)}
.leaf{display:block;width:100%;text-align:right;padding:9px 38px;color:var(--muted);font-size:14px;border-top:1px dashed var(--line)}
.leaf:hover{color:var(--fg)}
.tabsbar{display:flex;gap:8px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line);background:var(--surface)}
.btab{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.btab.on{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:#2a1d05;border-color:var(--gold)}
.rbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:8px;border-bottom:1px solid var(--line)}
.page{flex:1;min-height:0;overflow-y:auto;padding-block:16px 28px;font-family:var(--font-read)}
.page-in{max-width:720px;margin:0 auto}
.page .chap{font-family:var(--font-ui);color:var(--accent);font-weight:600;margin:18px 0 4px;font-size:15px}
.para{display:block;width:100%;text-align:right;border-radius:6px;padding:2px 4px;font-family:inherit}
.para.hl-yellow{background:var(--hl-yellow)}.para.hl-green{background:var(--hl-green)}.para.hl-blue{background:var(--hl-blue)}.para.hl-pink{background:var(--hl-pink)}
.note{background:color-mix(in srgb,var(--gold) 16%,transparent);border-radius:8px;padding:8px 10px;margin-top:6px;font-family:var(--font-ui);font-size:14px;line-height:1.7}
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line)}
.dot[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.btn{border:1px solid var(--line);border-radius:10px;padding:9px 14px;background:var(--bg)}
.btn.primary{background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo));color:#2a1d05;border-color:var(--gold);font-weight:600}
.qcard{background:linear-gradient(160deg,var(--navy-a),var(--navy-b));color:var(--on-navy);border:1px solid var(--gold);border-radius:14px;padding:26px 22px;font-family:var(--font-read)}
.qcard p{margin:0 0 14px;font-size:22px;line-height:2}
.qcard small{font-family:var(--font-ui);color:var(--gold-hi);font-size:13px;line-height:1.8;display:block}
.empty{color:var(--muted);text-align:center;padding:44px 16px;line-height:2}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30}
.demo{font-size:12px;color:var(--muted);text-align:center;padding:18px 0 28px}
nav.bottom{display:none;border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;font-size:12px;color:var(--muted)}
nav.bottom svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.bottom button[aria-current="page"]{color:var(--accent);font-weight:600}
@media (max-width:820px){
  #shell{flex-direction:column}
  aside{display:none}
  nav.bottom{display:flex}
  .mobbrand{display:block}
  .hero{padding-block:22px 20px}
}

.hnum{font-family:var(--font-ui);font-size:.55em;color:var(--accent);border:1px solid var(--gold);border-radius:999px;padding:0 7px;vertical-align:middle}
.banner{margin-top:12px;background:color-mix(in srgb,var(--gold) 12%,var(--surface));border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.9;color:var(--muted)}
.toclist{display:flex;flex-direction:column;max-height:48vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px}
.tocitem{display:flex;justify-content:space-between;gap:10px;text-align:right;padding-block:9px;padding-inline-end:10px;border-bottom:1px dashed var(--line);font-size:14px}
.tocitem:hover{background:color-mix(in srgb,var(--gold) 10%,transparent)}
.demo a,.status a{color:var(--accent)}

.grid.covers{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.bk{text-align:center}.bk .meta{text-align:center}.bk h3{margin:12px 0 6px}
.cover{display:block;width:100%;max-width:150px;margin:0 auto;border-radius:6px;box-shadow:0 8px 18px rgba(8,20,40,.28)}

.coverpage{max-width:360px;margin:8px auto 0;text-align:center;font-family:var(--font-ui);display:flex;flex-direction:column;gap:14px;align-items:center}
.coverpage .cover{max-width:250px}
.coverpage h2{margin:0;font-size:22px}

.coverimg{aspect-ratio:3/4;object-fit:cover;height:auto}
.page{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.para{-webkit-tap-highlight-color:transparent}
.page-in{will-change:transform,opacity}
.linklist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:100%;background:var(--surface)}
.linkrow{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px dashed var(--line);color:var(--accent);text-decoration:none;font-size:14px;text-align:right}
.linkrow:last-child{border-bottom:0}
.linkrow:hover{background:color-mix(in srgb,var(--gold) 10%,transparent)}

.askbar{display:flex;gap:10px;align-items:center;margin:8px 16px 10px;padding:6px 8px 6px 14px;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 18px rgba(8,20,40,.08)}
.askbar input{flex:1;min-width:0;background:none;border:0;padding:8px 6px;direction:rtl;font-size:14px}
.askbar .gold{padding:7px 16px;font-size:13px;border-radius:999px}
.calli{font-family:var(--font-display);font-size:40px;color:var(--accent);margin:0;font-weight:700}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.stat{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:20px;color:var(--fg)}.stat small{color:var(--muted);font-size:12.5px}.stat span.l{font-size:12.5px;color:var(--muted)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.catcard{display:flex;gap:12px;align-items:center;text-align:right;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.catcard b{display:block;font-size:17px}.catcard small{color:var(--muted);font-size:12.5px;line-height:1.7}
.catico{width:46px;height:46px;border-radius:12px;background:linear-gradient(160deg,var(--navy-a),var(--navy-b));color:var(--gold-hi);display:grid;place-items:center;flex:none}
.catico.light{background:color-mix(in srgb,var(--gold) 16%,var(--surface));color:var(--accent)}
.catico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cnt{margin-inline-start:auto;border:1px solid var(--line);border-radius:50%;min-width:26px;height:26px;display:grid;place-items:center;font-size:12px;color:var(--muted);flex:none}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card::before{content:"";position:absolute;top:-1px;inset-inline:22px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.card h2{margin:0 0 10px;font-size:18px;display:flex;gap:10px;align-items:center;font-weight:600}
.trow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 14px;border-top:1px dashed var(--line)}
.tbook{display:flex;gap:12px;align-items:center;text-align:right;flex:1;min-width:0}
.tbook b{display:block;font-size:16px}.tbook small{display:block;color:var(--muted);font-size:12.5px;line-height:1.7}
.mini{width:42px;height:52px;border-radius:5px;background:linear-gradient(160deg,var(--navy-a),var(--navy-b));color:var(--gold-hi);display:grid;place-items:center;font-family:var(--font-display);font-size:20px;flex:none}
.btn.sm{padding:5px 12px;font-size:13px}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--line);margin-inline-end:8px;vertical-align:middle}
.slide{display:flex;gap:12px;align-items:center;margin:14px 0}
.preview{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.steps p{margin:6px 0;line-height:2;color:var(--muted);font-size:14px}
.page.rlight{--hl-yellow:#f6e58d;--hl-green:#bfe3c4;--hl-blue:#bcd9f2;--hl-pink:#f4c6d6}
.page.rdark{--hl-yellow:#6b5f1c;--hl-green:#2e5a38;--hl-blue:#27506f;--hl-pink:#6e3347}
.tabrow{display:flex;gap:8px;margin:12px 0;overflow-x:auto}
.logobox{border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;max-width:200px;margin:12px auto;background:#fff}
.sumrow{display:flex;gap:12px;align-items:center;width:100%;text-align:right}
.sumrow .catico{width:40px;height:40px}
.sumrow b{display:block;font-size:17px;font-weight:600}.sumrow small{color:var(--muted);font-size:12.5px}
details.cat>summary::before{display:none}
details.cat>summary{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fnote{font-size:13px;color:var(--muted);line-height:1.9}

.msg{margin:12px 0;padding:12px 16px;border-radius:14px;line-height:2}
.msg.u{background:color-mix(in srgb,var(--gold) 14%,var(--surface));margin-inline-start:18%}
.msg.a{background:var(--surface);border:1px solid var(--line);font-family:var(--font-read);font-size:19px}
.msg .meta{font-family:var(--font-ui);font-size:13px}
.cite{color:var(--accent);border:1px solid var(--gold);border-radius:999px;padding:0 8px;font-size:.7em;font-family:var(--font-ui);margin:0 2px;vertical-align:middle;background:var(--bg)}
.chatform{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:var(--bg);padding:8px 0}
.chatform input{flex:1}
select.field{max-width:100%;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px}
.btn:disabled{opacity:.4;cursor:default}
.mmap{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px}.mmap summary{cursor:pointer;font-weight:700}
.mm{margin-top:10px;overflow-x:auto}.mm-root{display:inline-block;background:var(--accent,#c9a24b);color:#111;border-radius:12px;padding:8px 14px;font-weight:700;max-width:100%}.mm-root small{display:block;font-weight:400;opacity:.8}
.mm-kids{margin:6px 22px 0 0;border-right:2px solid var(--line);padding-right:14px;display:flex;flex-direction:column;gap:8px}
.mm-br{position:relative}.mm-br:before,.mm-leaf:before{content:'';position:absolute;right:-14px;top:14px;width:12px;border-top:2px solid var(--line)}
.mm-node{display:inline-block;border:1.5px solid var(--accent,#c9a24b);border-radius:10px;padding:4px 10px;font-weight:700;position:relative}
.mm-leaf{position:relative;display:block;text-align:right;font:inherit;font-size:14px;background:none;border:0;color:var(--fg);padding:3px 4px}
.mm-q .mm-leaf{opacity:.75}.mm-src{cursor:pointer;border-radius:8px}.mm-src:hover{background:var(--card2,rgba(127,127,127,.12))}
</style>
<div id="shell"></div>

async function getPack(u){
  const dec=async buf=>{const u8=new Uint8Array(buf);if(u8[0]===0x1f&&u8[1]===0x8b){const ds=new DecompressionStream('gzip');const st=new Blob([u8]).stream().pipeThrough(ds);return JSON.parse(await new Response(st).text())}return JSON.parse(new TextDecoder().decode(u8))};
  if(typeof DecompressionStream!=='undefined'){try{const r=await fetch(u+'.gz');if(r.ok){const b=await r.arrayBuffer();return await dec(b)}}catch(e){}}
  const r=await fetch(u);if(!r.ok)throw new Error('http');return r.json()}
async function srvCall(method,path,body){const r=await fetch(S.srv.url+path,{method,headers:srvHeaders(),body:body?JSON.stringify(body):undefined});let d=null;try{d=await r.json()}catch(e){}

function indexBook(b){
  b.pmap={};b.nmap={};
  let cur='',cc='';b.pages.forEach((pg,i)=>{if(!((pg.v+':'+pg.p) in b.pmap))b.pmap[pg.v+':'+pg.p]=i;pg.ps.forEach(p=>{p.n=norm(p.x);if(p.ch&&p.ch!==cur){cur=p.ch;cc=norm(cur)}p.cr=cur;p.cc=cc;if(p.num&&!(p.num in b.nmap))b.nmap[p.num]=i})});
}
function loadBook(id){
  const b=book(id);if(b.pages)return Promise.resolve(b);
  if(b.parts&&!loading[id])loading[id]=Promise.all(b.parts.map(u=>getPack(u))).then(ds=>{b.pages=ds.flatMap(d=>d.pages_data);b.toc=ds.flatMap(d=>d.toc||[]);indexBook(b);return b}).catch(e=>{delete loading[id];throw e});
  if(!loading[id])loading[id]=((b.server||b.custom)?fetch(b.server?`${S.srv.url}/api/books/${id}.json`:b.src.u,b.server?{headers:srvHeaders()}:undefined).then(r=>{if(!r.ok)throw new Error('http');return r.json()}):getPack(`books/${id}.json`)).then(d=>{if(!d||!Array.isArray(d.pages_data))throw new Error('format');b.pages=d.pages_data;b.toc=d.toc||[];if(b.custom){b.npages=b.pages.length;b.volumes=1;b.volumes=Math.max(...b.pages.map(x=>x.v));b.toc_items=b.toc.length}indexBook(b);return b}).catch(e=>{delete loading[id];throw e});
  return loading[id];
}
function pageIndex(b,v,p,part){
  const i=b.pmap[v+':'+p];if(i!==undefined)return Math.min(b.pages.length-1,i+((part||1)-1));
  const j=b.pages.findIndex(pg=>pg.v===v&&pg.p>=p);return j<0?0:j;
}

}

function doSearch(){
  const q=norm(S.q);S.hits=[];S.more=false;if(q.length<2)return;
  for(const b of BOOKS){
    if(norm(b.title+' '+b.author).includes(q))S.hits.push({b,pi:0,x:'تطابق في العنوان أو المؤلف',t:1});
    if(!b.pages)continue;
    for(let i=0;i<b.pages.length;i++)for(const p of b.pages[i].ps){
      const k=p.n.indexOf(q);
      if(k>=0){if(S.hits.length>=80){S.more=true;return}
        const s=Math.max(0,k-60);S.hits.push({b,pi:i,x:(s?'… ':'')+p.x.slice(s,s+240)+(p.x.length>s+240?' …':''),num:p.num})}}
  }
}

const STOPN=new Set(['من','في','على','عن','الي','ما','ماذا','هل','كيف','هو','هي','ان','لا','التي','الذي','هذا','هذه','عند','بين','كان','قال','عليه','حديث','احاديث','الحديث','الاحاديث','ورد','وردت']);
const qTokens=q=>[...new Set(norm(q).split(' ').map(t=>t.replace(/^(وال|بال|كال|فال|لل|ال)/,'')).filter(t=>t.length>=2&&!STOPN.has(t)))];
let AISCOPE=null;
function searchLib(q,limit=8,bookSub=''){
  const ts=qTokens(q);if(!ts.length)return [];const need=ts.length<=2?ts.length:Math.ceil(ts.length*0.7),bn=bookSub?norm(bookSub):'',out=[];
  for(const b of BOOKS){if(!b.pages)continue;if(AISCOPE&&!AISCOPE.has(b.id))continue;if(bn&&!norm(b.title).includes(bn))continue;
    for(let i=0;i<b.pages.length;i++)for(const p of b.pages[i].ps){let mc=0,sc=0;for(const t of ts){if(p.n.includes(t)){mc++;sc+=2}else if(p.cc&&p.cc.includes(t)){mc++;sc+=1}}if(mc>=need)out.push({b,i,p,sc})}}
  out.sort((a,b)=>b.sc-a.sc||a.p.x.length-b.p.x.length);return out.slice(0,limit)}
function searchMany(qs,limit=12){const map=new Map();
  for(const q of qs)for(const h of searchLib(q,10)){const k=h.b.id+'|'+h.p.id,o=map.get(k);if(o)o.sc+=h.sc+1;else map.set(k,{...h})}
  return [...map.values()].sort((a,b)=>b.sc-a.sc||a.p.x.length-b.p.x.length).slice(0,limit)}
const citeKey={};

    if(!r.ok||!/json/.test(r.headers.get('content-type')||''))throw 0;const d=await r.json();if(!Array.isArray(d.hits))throw 0;return d.hits}

const AIP={

function makeAI(cfg){
  const P=cfg.prov,model=t=>t==='default'?(cfg.md||AIP[P].d):(cfg.mq||AIP[P].q);
  const fail=(code,text)=>{const e=new Error(code);e.code=code;if(text)e.text=text;return e};
  const merge=msgs=>{const out=[];for(const m of msgs){const r=m.role==='assistant'?'assistant':'user';if(out.length&&out[out.length-1].role===r)out[out.length-1].content+='\n\n'+m.content;else out.push({role:r,content:m.content})}if(out.length&&out[0].role!=='user')out.unshift({role:'user',content:'.'});return out};
  function req(msgs,o,stream){const ms=merge(msgs),m=o._m||model(o.modelTier);
    if(P==='gemini'){const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(m)}:${stream?'streamGenerateContent?alt=sse&':'generateContent?'}key=${encodeURIComponent(cfg.key)}`;
      const body={contents:ms.map(x=>({role:x.role==='assistant'?'model':'user',parts:[{text:x.content}]})),generationConfig:{temperature:.3,...(o.json?{responseMimeType:'application/json'}:{})}};

  const piece=j=>P==='gemini'?((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||'').join('')):P==='anthropic'?(j.type==='content_block_delta'&&j.delta&&j.delta.text||''):(j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content||'');
  const full=j=>P==='gemini'?piece(j):P==='anthropic'?((j.content||[]).map(c=>c.text||'').join('')):(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'');
  const RES={};
  async function resolveGem(tier){const k=tier==='default'?'d':'q';if(RES[k])return RES[k];
    try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key='+encodeURIComponent(cfg.key));if(!r.ok)return null;const j=await r.json();
      const ok=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,'')).filter(n=>/^gemini-[\d.]+-flash/.test(n)&&!/(image|tts|live|audio|thinking|preview|exp|latest|robotics|computer)/.test(n));
      const ver=n=>parseFloat((n.match(/^gemini-([\d.]+)/)||[0,0])[1]);
      const want=k==='q'?ok.filter(n=>/lite/.test(n)):ok.filter(n=>!/lite/.test(n));const pool=want.length?want:ok;
      pool.sort((a,b)=>ver(b)-ver(a)||a.length-b.length);return RES[k]=pool[0]||null}catch(e){return null}}
  async function call(msgs,o,stream,retried){
    if(P==='gemini'&&RES[o.modelTier==='default'?'d':'q']&&!cfg['m'+(o.modelTier==='default'?'d':'q')])o={...o,_m:RES[o.modelTier==='default'?'d':'q']};
    const {url,init}=req(msgs,o,stream);let r;
    try{r=await fetch(url,{...init,signal:o.signal})}catch(e){if(e&&e.name==='AbortError')throw fail('cancelled');const er=fail('network');er.detail='لم يصل الطلب: '+(e&&e.message||'');throw er}
    if(!r.ok&&r.status===404&&P==='gemini'&&!retried){const k=o.modelTier==='default'?'d':'q';delete RES[k];const m2=await resolveGem(o.modelTier);if(m2)return call(msgs,{...o,_m:m2},stream,true)}
    if(!r.ok){let t='';try{const j=await r.json();t=(j.error&&(j.error.message||j.error.status))||''}catch(e){}const d=r.status+(t?' '+String(t).slice(0,160):'');let er;if(r.status===429)er=fail('rate_limited');else if([400,401,403].includes(r.status))er=fail('bad_key');else er=fail('network');er.detail=d;throw er}

        let j;try{j=JSON.parse(d)}catch(e){continue}const t=piece(j);if(t){text+=t;o.onText&&o.onText({text,delta:t})}}}}

  f.limits=async()=>({});f.custom=true;return f}
const aiCfgCard=()=>{const c=loadAICfg()||{prov:'gemini'},p=AIP[c.prov];return `<div class="card" style="margin:0 0 12px"><h3 style="margin:0 0 6px">ربط الباحث الذكي بمفتاحك</h3>

async function askAI(q){
  q=(q||'').trim();if(!S.ai||S.aiBusy||!q)return;
  const prev=[...S.chat].reverse().find(x=>x.role==='user');const prevQ=prev?prev.text:'';
  S.chat.push({role:'user',text:q});const m={role:'assistant',text:'',pending:true,q};S.chat.push(m);
  S.aiBusy=true;S.aiErr='';S.aq='';S.aiStatus='أفهم سؤالك…';S.aiCtl=new AbortController();render();
  const fatal=c=>['not_granted','sampling_disabled','not_declared','capability_disabled','session_expired','rate_limited','cancelled','bad_key','network'].includes(c);
  try{
    let sh=null;
    const loading=Promise.resolve();
    let queries=[q];
    try{const r=await (S.ai.json?S.ai.json(expandPrompt(q,prevQ),{modelTier:'quick',signal:S.aiCtl.signal}):Promise.reject({code:'invalid_json'}));
      const qs=((r&&r.queries)||[]).filter(x=>typeof x==='string'&&x.trim()).slice(0,6);if(qs.length){queries=[...qs,q];m.qs=qs}if(r&&typeof r.intent==='string')m.intent=r.intent.slice(0,200)}
    catch(e){if(e&&fatal(e.code))throw e}

    let r;sh=await srvSearch(queries);if(sh){const ok=new Set(aiSel().map(b=>b.id));sh=sh.filter(h=>ok.has(h.book));r=await packSrvHits(sh)}if(sh);else{const sel=aiSel();S.aiStatus=sel.some(b=>b.big&&!b.pages)?'أحمّل الكتب الكبيرة (أول مرة فقط، قد يستغرق دقيقة)…':'أبحث في الكتب…';paintLast();await Promise.all(sel.map(b=>loadBook(b.id)));S.aiStatus='أبحث في الكتب…';paintLast();AISCOPE=new Set(sel.map(b=>b.id));try{r=packHits(searchMany(queries,12))}finally{AISCOPE=null}}
    S.aiStatus='أقرأ النتائج…';paintLast();
    const hist=S.chat.slice(0,-2).filter(x=>x.text).slice(-6).map(x=>({role:x.role,content:x.text}));
    const body=`سؤال الشخص: ${q}\n${m.intent?'المقصود كما فهمناه: '+m.intent+'\n':''}\nالنصوص التي وجدها البحث (قد لا يكون بعضها ذا صلة):\n`+(r.length?r.map(x=>`[${x.n}] ${x.book}، ج${x.volume} ص${x.page}${x.hadith_no?' حديث '+x.hadith_no:''}${x.chapter?' — '+x.chapter:''}: ${x.text}`).join('\n\n'):'(لا نتائج)');

  }catch(e){

}

function addBook(){
  const d=S.draft,url=(d.ab_url||'').trim(),title=(d.ab_title||'').trim();
  let u;try{u=new URL(url);if(!/^https?:$/.test(u.protocol))throw 0}catch(e){toast('الرابط غير صالح: يجب أن يبدأ بـ https://');return}
  if(!title){toast('اكتب عنوان الكتاب');return}
  const kind=d.ab_kind||detectKind(url);if(!kind){toast('تعذّر تحديد نوع الرابط، اختره يدوياً');return}
  const w=title.split(/\s+/),lines=w.length>1?[w[0].slice(0,14),w.slice(1).join(' ').slice(0,14)]:[title.slice(0,14)];
  const c=mkCustom({id:'c'+Date.now().toString(36),title,author:(d.ab_author||'').trim()||'—',category:d.ab_cat||CATS[0].id,edition:(d.ab_ed||'').trim(),src:{kind,u:u.href},status:'draft',lines,authorShort:(d.ab_author||'').trim().slice(0,22),color:'#173a63'});
  ALL.push(c);S.draft={};saveCustom();rebuild();toast('أُضيف كمسودة');
}

async function addBookSrv(){
  const d=S.draft,url=(d.ab_url||'').trim(),title=(d.ab_title||'').trim();
  if(!url||!title){toast('الرابط والعنوان مطلوبان');return}
  const tgt=d.ab_for?book(d.ab_for):null;
  try{await srvCall('POST','/api/books',{url,title,author:d.ab_author||(tgt?tgt.author:''),edition:d.ab_ed||'',category:tgt?tgt.category:(d.ab_cat||CATS[0].id),kind:d.ab_kind||undefined,scan_for:d.ab_for||''});
    S.draft={};await refreshSrv();toast('بدأ الاستيراد');pollSrv()}
  catch(e){toast(e.message)}
}

  const info=document.getElementById('pginfo');if(info)info.textContent=pgLabel(pg);
  const sl=document.getElementById('slider');if(sl&&+sl.value!==pi+1)sl.value=pi+1;
  const nx=document.querySelector('[data-act=pg][data-v="1"]'),pv=document.querySelector('[data-act=pg][data-v="-1"]');
  if(nx)nx.disabled=pi>=b.pages.length-1;if(pv)pv.disabled=pi===0;
  if(dir&&!reduceMotion()&&box.animate)box.animate([{opacity:0,transform:`translateX(${-dir*28}px)`},{opacity:1,transform:'none'}],{duration:200,easing:'ease-out'});
}

(async()=>{const cfg=loadAICfg()||(window.TURATH_KEY?{prov:'gemini',key:window.TURATH_KEY,shared:true}:null);if(cfg){S.ai=makeAI(cfg);render();return}try{if(window.claude){const f=await claude.use('sample');if(f){S.ai=f;try{const l=await f.limits();S.aiTools=!!(l&&l.tools)}catch(e){S.aiTools=false}render()}}}catch(e){S.ai=null}})();
applyTheme();render();loadCatalog().then(pollSrv);
